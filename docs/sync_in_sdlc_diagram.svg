<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1340" width="100%" height="100%">
  <defs>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.02"/>
    </filter>

    <style>
      .t-font {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
      }
      .b-font {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- PURE WHITE CONTAINER BACKGROUND -->
  <rect width="840" height="1340" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- HEADER -->
  <g transform="translate(420, 52)" text-anchor="middle">
    <rect x="-140" y="-22" width="280" height="24" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <circle cx="-110" cy="-10" r="3.5" fill="#0284C7"/>
    <text x="10" y="-7" class="b-font" font-size="10.5" font-weight="700" fill="#0284C7" letter-spacing="1.5">SDLC PHASES &amp; ACTIVITIES</text>
    
    <text x="0" y="32" class="t-font" font-size="28" fill="#0F172A">
      Sync-in: Lifecycle Activities
    </text>
    <text x="0" y="52" class="b-font" font-size="12" fill="#64748B">
      Campus Events Attendance Platform (Himamat &amp; Strands of Love)
    </text>
  </g>

  <!-- CENTRAL CONNECTING TIMELINE LINE -->
  <line x1="120" y1="130" x2="120" y2="1250" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="120" y1="130" x2="120" y2="1250" stroke="#0284C7" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ==================== 1. COMMUNICATION ==================== -->
  <g transform="translate(85, 125)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">01</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Communication</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Stakeholder alignment with Student Affairs, Event Organizers, and Student Council</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">Initiation</text>
    </g>
  </g>

  <!-- ==================== 2. REQUIREMENT GATHERING ==================== -->
  <g transform="translate(85, 205)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">02</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Requirement Gathering</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Dual Time In/Time Out check-ins, anti-proxy QR rotation, absence exemption workflows</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#0284C7" text-anchor="middle">Discovery</text>
    </g>
  </g>

  <!-- ==================== 3. FEASIBILITY STUDY ==================== -->
  <g transform="translate(85, 285)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">03</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Feasibility Study</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Technical gate throughput (100 scans/min), venue network dead-zones &amp; budget check</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">Feasibility</text>
    </g>
  </g>

  <!-- ==================== 4. SYSTEM ANALYSIS ==================== -->
  <g transform="translate(85, 365)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">04</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">System Analysis</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Queue modeling, event state machine (Pending, In-Session, Completed), Data Flow (DFD)</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#0284C7" text-anchor="middle">Analysis</text>
    </g>
  </g>

  <!-- ==================== 5. SOFTWARE DESIGN ==================== -->
  <g transform="translate(85, 445)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">05</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Software Design</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">White/Light Blue UI architecture, ER diagrams, HMAC token cryptographic specs</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#B45309" text-anchor="middle">Design</text>
    </g>
  </g>

  <!-- ==================== 6. CODING ==================== -->
  <g transform="translate(85, 525)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">06</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Coding (Development)</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Mobile app implementation (Flutter), API backend (Go/Node.js), QR optical scanner engine</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="middle">Build</text>
    </g>
  </g>

  <!-- ==================== 7. TESTING ==================== -->
  <g transform="translate(85, 605)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">07</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Testing</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">3,000-student burst stress tests (Himamat load), anti-screenshot &amp; replay attack testing</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#BE123C" text-anchor="middle">Quality</text>
    </g>
  </g>

  <!-- ==================== 8. INTEGRATION ==================== -->
  <g transform="translate(85, 685)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">08</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Integration</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Binding with University Student Information System (SIS), LDAP SSO, S3 document storage</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F0F9FF" stroke="#BAE6FD"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#0284C7" text-anchor="middle">Integrate</text>
    </g>
  </g>

  <!-- ==================== 9. IMPLEMENTATION ==================== -->
  <g transform="translate(85, 765)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">09</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Implementation (Deployment)</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">App Store / Play Store release, Strands of Love pilot test, gate marshal device rollout</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Deploy</text>
    </g>
  </g>

  <!-- ==================== 10. OPERATIONS & MAINTENANCE ==================== -->
  <g transform="translate(85, 845)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">10</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Operations &amp; Maintenance</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Live gate telemetry monitoring, certified activity credit PDF exports, OS compatibility updates</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#15803D" text-anchor="middle">Live Ops</text>
    </g>
  </g>

  <!-- ==================== 11. DISPOSITION ==================== -->
  <g transform="translate(85, 925)">
    <circle cx="35" cy="32" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <text x="35" y="36.5" class="t-font" font-size="11.5" fill="#0284C7" text-anchor="middle">11</text>
    <g transform="translate(75, 0)" filter="url(#softCardShadow)">
      <rect width="600" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="5" height="64" rx="2.5" fill="#0284C7"/>
      <text x="20" y="26" class="t-font" font-size="15" fill="#0F172A">Disposition</text>
      <text x="20" y="45" class="b-font" font-size="11" fill="#64748B">Academic year-end data archival, secure deletion of medical certificates, legacy event retirement</text>
      <rect x="500" y="20" width="82" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="541" y="34.5" class="b-font" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">Archive</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(420, 1025)" text-anchor="middle">
    <text class="b-font" font-size="11" fill="#94A3B8">
      Sync-in Academic Software Engineering • End-to-End SDLC Framework
    </text>
  </g>
</svg>
